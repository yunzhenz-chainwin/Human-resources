name: Backend PostgreSQL

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - "*.ps1"
      - "*.sh"
      - "resume_anonymizer.py"
      - "*.bat"
      - ".github/workflows/backend-postgres.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - "*.ps1"
      - "*.sh"
      - "resume_anonymizer.py"
      - "*.bat"
      - ".github/workflows/backend-postgres.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talenthub_test
          POSTGRES_USER: talenthub
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talenthub -d talenthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://talenthub:ci-only-password@localhost:5432/talenthub_test
      AUTH_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      RESUME_STORAGE_PATH: ${{ github.workspace }}/backend/storage/test-resumes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install the system packages the PDF and OCR tests need
        # ubuntu-latest ships neither a CJK font nor an OCR toolchain, so the
        # candidate-PDF renderer and the scanned-resume guard both fail on a bare
        # runner. fonts-noto-cjk installs to the /usr/share/fonts path the three
        # font lookups already search, and the OCR guard checks for chi_tra by
        # name before it will run, so the language pack is not optional.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk tesseract-ocr tesseract-ocr-chi-tra poppler-utils
      - name: Verify the OCR and font toolchain resolved
        # Fail here with a readable message rather than inside a test assertion
        # if a future runner image moves the font or drops a package.
        run: |
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          tesseract --list-langs | grep -qx chi_tra
          command -v pdftoppm
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Check single migration head
        run: test "$(python -m alembic heads | wc -l)" -eq 1
      - name: Migrate empty PostgreSQL database
        run: python -m alembic upgrade head
      - name: Verify migrated schema
        run: python scripts/postgres_schema_smoke.py
      - name: Run backend tests against PostgreSQL
        run: python -m pytest -q
      - name: Lint backend
        run: python -m ruff check app tests scripts

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy compose files
        # Provide the now-required secrets and an empty env file so `config` can
        # resolve interpolation without starting anything.
        env:
          POSTGRES_PASSWORD: ci-only
          S3_SECRET_KEY: ci-only
        run: |
          touch .env
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/compose.storage.yml config -q

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Scan dependencies for known vulnerabilities
        # Audit the installed backend dependencies.  A newly disclosed advisory
        # in a transitive dep must not spuriously block unrelated PRs, so this
        # is non-blocking; the findings still surface in the step log and the
        # step is marked failed in the run summary.
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit
