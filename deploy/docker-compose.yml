services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talenthub}
      POSTGRES_USER: ${POSTGRES_USER:-talenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talenthub_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - resume_data:/app/storage/resumes
      # Keep profile photos outside the container writable layer.  This is a
      # separate volume so existing resume_data layouts remain compatible.
      - candidate_photo_data:/app/storage/candidate-photos

  migrate:
    build: ../backend
    restart: "no"
    env_file: ../.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  career-frontend:
    build: ../career-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  resume_data:
  candidate_photo_data:
