services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talenthub}
      POSTGRES_USER: ${POSTGRES_USER:-talenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: "1.0"

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    # Bind to loopback only: the raw API (and /docs) must not be reachable on
    # the LAN.  Browsers hit the frontends, which proxy to backend:8000 over the
    # compose network.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - resume_data:/app/storage/resumes
      # Keep profile photos outside the container writable layer.  This is a
      # separate volume so existing resume_data layouts remain compatible.
      - candidate_photo_data:/app/storage/candidate-photos
    mem_limit: 1g
    cpus: "2.0"

  migrate:
    build: ../backend
    restart: "no"
    env_file: ../.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: "1.0"

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.5"

  career-frontend:
    build: ../career-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.5"

volumes:
  postgres_data:
  resume_data:
  candidate_photo_data:
