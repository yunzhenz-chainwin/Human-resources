<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentHub 專案甘特圖</title>
<style>
  :root{
    --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb; --line2:#eef1f5;
    --weekend:#f4f6f9; --bg:#ffffff; --panel:#fbfcfe; --today:#e11d48;
    --name-w:150px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#f0f2f6;color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.5;}
  .wrap{max-width:1180px;margin:24px auto;padding:0 20px;}
  header.top{margin-bottom:16px;}
  header.top h1{margin:0;font-size:24px;letter-spacing:.5px;}
  header.top p.sub{margin:4px 0 0;color:var(--sub);font-size:13px;}

  .card{background:var(--bg);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 1px 3px rgba(16,24,40,.04);padding:18px 18px 8px;margin-bottom:20px;}

  /* Gantt */
  .gantt{position:relative;overflow-x:auto;}
  .gantt-inner{min-width:820px;}
  .row{position:relative;display:flex;align-items:stretch;}
  .name{flex:0 0 var(--name-w);width:var(--name-w);padding:0 10px;
    display:flex;align-items:center;font-size:12.5px;color:#374151;
    border-right:1px solid var(--line);}
  .track{position:relative;flex:1;height:100%;}

  /* time axis area */
  .axis{position:relative;height:46px;}
  .axis .track{height:46px;}
  .month{position:absolute;top:0;height:24px;border-left:1px solid var(--line);
    font-size:12px;color:#374151;padding:4px 0 0 6px;font-weight:600;white-space:nowrap;}
  .wk{position:absolute;top:24px;bottom:0;border-left:1px solid var(--line2);}
  .wklab{position:absolute;top:26px;font-size:9px;color:#aab1bd;transform:translateX(2px);}

  /* backdrop layer spanning all phase rows: weekends + week lines + today */
  .backdrop{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;}
  .weekend{position:absolute;top:0;bottom:0;background:var(--weekend);}
  .gline{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);}
  .mline{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);}

  .bars{position:relative;}
  .bars .row{height:38px;border-bottom:1px solid var(--line2);}
  .bars .row:last-child{border-bottom:none;}
  .bar{position:absolute;top:6px;height:26px;border-radius:6px;
    display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 1px 2px rgba(16,24,40,.18);cursor:default;}
  .bar b{font-weight:700;margin-right:5px;}

  /* today line over everything */
  .today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--today);z-index:5;}
  .today .flag{position:absolute;top:-2px;left:3px;background:var(--today);color:#fff;
    font-size:10px;padding:1px 5px;border-radius:3px;white-space:nowrap;}

  /* milestones row */
  .ms{position:relative;height:44px;border-top:1px dashed var(--line);margin-top:2px;}
  .ms .track{height:44px;}
  .diamond{position:absolute;top:12px;width:12px;height:12px;background:#0e7490;
    transform:translateX(-6px) rotate(45deg);border:1.5px solid #fff;
    box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .mslab{position:absolute;top:26px;font-size:10px;color:#374151;transform:translateX(-50%);
    white-space:nowrap;text-align:center;}
  .mslab b{color:#0e7490;}
  .diamond.hot{background:#d97706;width:15px;height:15px;top:10px;transform:translateX(-7px) rotate(45deg);
    box-shadow:0 0 0 3px rgba(217,119,6,.18),0 1px 3px rgba(0,0,0,.25);}
  .mslab.hot{top:28px;font-weight:700;}
  .mslab.hot b{color:#b45309;}

  /* legend */
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 2px 6px;font-size:11.5px;color:#4b5563;}
  .legend .it{display:flex;align-items:center;gap:6px;}
  .sw{width:14px;height:12px;border-radius:3px;display:inline-block;}
  .sw.dia{background:#0e7490;transform:rotate(45deg);width:10px;height:10px;}
  .sw.hot{background:#d97706;transform:rotate(45deg);width:10px;height:10px;}
  .sw.wknd{background:var(--weekend);border:1px solid var(--line);}
  .sw.td{background:var(--today);width:3px;height:14px;border-radius:1px;}

  /* table */
  h2.sec{font-size:16px;margin:2px 0 12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  thead th{background:#f6f8fb;color:#374151;font-size:12.5px;border-bottom:2px solid var(--line);}
  tbody tr.hot td{background:#fff8ef;}
  td.mcol{font-weight:700;white-space:nowrap;}
  td.mcol .dot{display:inline-block;width:8px;height:8px;background:#0e7490;
    transform:rotate(45deg);margin-right:6px;}
  tr.hot td.mcol .dot{background:#d97706;}
  td.dcol{white-space:nowrap;color:#4b5563;}
  .badge{display:inline-block;background:#fef3e2;color:#b45309;font-size:11px;
    padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:700;}
  footer{color:var(--sub);font-size:11.5px;text-align:center;margin:8px 0 30px;}

  @media print{
    @page{size:A4 landscape;margin:10mm;}
    body{background:#fff;font-size:11px;}
    .wrap{max-width:none;margin:0;padding:0;}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;margin-bottom:12px;}
    .gantt{overflow:visible;}
    .gantt-inner{min-width:0;}
    header.top h1{font-size:19px;}
    .bar{box-shadow:none;}
    table{font-size:10.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>TalentHub 專案甘特圖</h1>
    <p class="sub">2026-07-20 啟動｜方案A：1 名全端工程師（詳 docs/07）</p>
  </header>

  <div class="card">
    <div class="gantt">
      <div class="gantt-inner" id="chart">
        <!-- 時間軸 -->
        <div class="axis row">
          <div class="name" style="border-right:1px solid var(--line);align-items:flex-end;padding-bottom:4px;color:#9aa2ae;font-size:11px;">階段 / Phase</div>
          <div class="track" id="axis"></div>
        </div>
        <!-- Phase bars -->
        <div class="bars" id="bars">
          <div class="backdrop" id="backdrop"></div>
        </div>
        <!-- 里程碑 -->
        <div class="ms row">
          <div class="name" style="color:#0e7490;font-size:11px;">里程碑</div>
          <div class="track" id="msTrack"></div>
        </div>
      </div>
    </div>

    <div class="legend">
      <span class="it"><span class="sw dia"></span>一般里程碑</span>
      <span class="it"><span class="sw hot"></span>M2 MVP 試營運</span>
      <span class="it"><span class="sw wknd"></span>週末</span>
      <span class="it"><span class="sw td"></span>今天 2026-07-13</span>
    </div>
  </div>

  <div class="card">
    <h2 class="sec">里程碑一覽表</h2>
    <table>
      <thead>
        <tr><th style="width:150px;">里程碑</th><th style="width:110px;">日期</th><th>內容</th><th>對 HR 的意義</th></tr>
      </thead>
      <tbody id="msTable"></tbody>
    </table>
  </div>

  <footer>資料來源：docs/07-開發時程與里程碑.md（v1.0）｜總跨度 2026-07-13 ~ 2026-12-05</footer>
</div>

<script>
(function(){
  var START = new Date(2026,6,13);   // 2026-07-13
  var END   = new Date(2026,11,5);   // 2026-12-05
  var MS_DAY = 86400000;
  var SPAN = Math.round((END - START)/MS_DAY); // 145 天

  function d(y,m,day){return new Date(y,m-1,day);}
  function pct(date){return (date - START)/MS_DAY / SPAN * 100;}

  var palette = ['#7c9cbf','#6ba3a0','#8aa06b','#c98f5a','#b07fb0','#5f8bc4','#c78ba0','#5aa17a'];

  var phases = [
    {id:'P0',name:'需求確認',       sum:'欄位定稿·樣本蒐集·環境盤點', s:d(2026,7,20), e:d(2026,7,24)},
    {id:'P1',name:'基礎建設',       sum:'Repo/CI·Compose·Auth·RBAC',  s:d(2026,7,27), e:d(2026,8,7)},
    {id:'P2',name:'人才庫核心',     sum:'CRUD·搜尋·標籤·聯繫紀錄',    s:d(2026,8,10),e:d(2026,8,28)},
    {id:'P3',name:'履歷解析匯入',   sum:'104/1111解析·校對·去重·監控', s:d(2026,8,31),e:d(2026,9,25)},
    {id:'P4',name:'職缺需求管理',   sum:'需求單精靈·簽核流·職缺看板', s:d(2026,9,28),e:d(2026,10,9)},
    {id:'P5',name:'智慧配對',       sum:'計分引擎·推薦名單·主管回饋', s:d(2026,10,12),e:d(2026,10,30)},
    {id:'P6',name:'完善強化',       sum:'報表·通知·資安·效能壓測',    s:d(2026,11,2),e:d(2026,11,13)},
    {id:'P7',name:'UAT與上線',      sum:'UAT·真實資料試跑·教育訓練',  s:d(2026,11,16),e:d(2026,11,27)}
  ];

  var milestones = [
    {id:'M0',date:d(2026,7,24), c:'Kickoff、需求定稿',            hr:'欄位與流程共識'},
    {id:'M1',date:d(2026,8,28), c:'人才庫可用',                  hr:'可開始集中管理人才'},
    {id:'M2',date:d(2026,9,25), c:'履歷自動匯入（MVP 試營運）', hr:'建檔時間 15 分鐘 → 30 秒', hot:true},
    {id:'M3',date:d(2026,10,9), c:'需求單上線',                  hr:'主管需求數位化'},
    {id:'M4',date:d(2026,10,30),c:'智慧配對上線',                hr:'開缺 1 小時內拿到名單'},
    {id:'M5',date:d(2026,11,27),c:'全功能正式上線',              hr:'完整生態圈運作'}
  ];

  function fmt(dt){
    var m=('0'+(dt.getMonth()+1)).slice(-2), day=('0'+dt.getDate()).slice(-2);
    return dt.getFullYear()+'-'+m+'-'+day;
  }
  function fmtMD(dt){return ('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);}

  // ---- 時間軸：月份刻度 ----
  var axis = document.getElementById('axis');
  var months = [d(2026,7,1),d(2026,8,1),d(2026,9,1),d(2026,10,1),d(2026,11,1),d(2026,12,1)];
  months.forEach(function(mo){
    var p = mo < START ? 0 : pct(mo);
    var el = document.createElement('div');
    el.className='month'; el.style.left=p+'%';
    el.textContent = mo.getFullYear()+'年'+(mo.getMonth()+1)+'月';
    axis.appendChild(el);
  });

  // ---- 週刻度（週一）＋週末背景，建立於 backdrop 與 axis ----
  var backdrop = document.getElementById('backdrop');
  var cur = new Date(START);
  // 逐日掃描：標週末底、每週一畫細線
  for(var t=0; t<=SPAN; t++){
    var day = new Date(START.getTime()+t*MS_DAY);
    var dow = day.getDay();
    var left = pct(day);
    var w = 100/SPAN;
    if(dow===6 || dow===0){ // 週末淺灰底條
      var we = document.createElement('div');
      we.className='weekend';
      we.style.left=left+'%'; we.style.width=w+'%';
      backdrop.appendChild(we);
    }
    if(dow===1){ // 週一：細直線（backdrop + 軸上刻度）
      var gl = document.createElement('div');
      gl.className='gline'; gl.style.left=left+'%';
      backdrop.appendChild(gl);
      var wk = document.createElement('div');
      wk.className='wk'; wk.style.left=left+'%';
      axis.appendChild(wk);
    }
  }
  // 月份主線（backdrop 加粗）
  months.forEach(function(mo){
    if(mo<=START) return;
    var ml=document.createElement('div');
    ml.className='mline'; ml.style.left=pct(mo)+'%';
    backdrop.appendChild(ml);
  });

  // ---- Phase 橫 bar ----
  var bars = document.getElementById('bars');
  phases.forEach(function(p,i){
    var row=document.createElement('div'); row.className='row';
    var nm=document.createElement('div'); nm.className='name';
    nm.innerHTML='<b style="color:#374151;margin-right:6px;">'+p.id+'</b>'+p.name;
    var tr=document.createElement('div'); tr.className='track';
    var barEnd = new Date(p.e.getTime()+MS_DAY); // 含結束當日
    var bar=document.createElement('div'); bar.className='bar';
    bar.style.left=pct(p.s)+'%';
    bar.style.width=(pct(barEnd)-pct(p.s))+'%';
    bar.style.background=palette[i];
    bar.title=p.id+' '+p.name+'：'+fmt(p.s)+' ~ '+fmt(p.e);
    bar.innerHTML='<b>'+p.id+'</b>'+p.sum;
    tr.appendChild(bar);
    row.appendChild(nm); row.appendChild(tr);
    bars.appendChild(row);
  });

  // ---- 今天縱線（跨越 bars 區）----
  var today=d(2026,7,13);
  var todayLine=document.createElement('div');
  todayLine.className='today'; todayLine.style.left=pct(today)+'%';
  todayLine.innerHTML='<span class="flag">今天 '+fmt(today)+'</span>';
  bars.appendChild(todayLine);

  // ---- 里程碑列 ----
  var msTrack=document.getElementById('msTrack');
  milestones.forEach(function(m){
    var pos = pct(new Date(m.date.getTime()+MS_DAY)); // 對齊當日結束/bar 右緣
    var dia=document.createElement('div');
    dia.className='diamond'+(m.hot?' hot':'');
    dia.style.left=pos+'%';
    dia.title=m.id+'：'+fmt(m.date)+'　'+m.c;
    var lab=document.createElement('div');
    lab.className='mslab'+(m.hot?' hot':'');
    lab.style.left=pos+'%';
    lab.innerHTML='<b>'+m.id+'</b> '+fmtMD(m.date)+(m.hot?'<br>MVP':'');
    msTrack.appendChild(dia); msTrack.appendChild(lab);
  });

  // ---- 里程碑表 ----
  var tb=document.getElementById('msTable');
  milestones.forEach(function(m){
    var tr=document.createElement('tr'); if(m.hot) tr.className='hot';
    tr.innerHTML='<td class="mcol"><span class="dot"></span>'+m.id+
      (m.hot?'<span class="badge">MVP 試營運</span>':'')+'</td>'+
      '<td class="dcol">'+fmt(m.date)+'</td>'+
      '<td>'+m.c+'</td>'+
      '<td>'+m.hr+'</td>';
    tb.appendChild(tr);
  });
})();
</script>
</body>
</html>
