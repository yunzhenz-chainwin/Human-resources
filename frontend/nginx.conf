server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Backend accepts resumes up to 10 MiB.  Leave protocol overhead while
    # rejecting unexpectedly large requests at the reverse proxy boundary.
    client_max_body_size 11m;

    # Security response headers.  Set at the server level so they are inherited
    # by every location that does not declare its own add_header.  No HSTS: this
    # vhost is served over plain HTTP behind the LAN reverse proxy.  The CSP also
    # allows Google Fonts (googleapis stylesheet + gstatic font files), which the
    # built SPA loads via a CSS @import in src/style.css.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        # Stream uploads to the API instead of buffering candidate documents
        # into the Nginx container's temporary filesystem.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standalone editable resume template tool.  This static page relies on
    # inline event handlers (onclick=...) that the strict global CSP blocks, and
    # its "download as PDF" bundles html2canvas, which rasterises the page via a
    # blob: <img>.  Serve it with a CSP that additionally allows 'unsafe-inline'
    # scripts, scoped to this path only so the SPA keeps the strict policy.  An
    # add_header in a location replaces the server-level set, so the other
    # security headers are repeated here.
    location /templates/ {
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
