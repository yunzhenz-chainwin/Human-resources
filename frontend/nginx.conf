server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Backend accepts resumes up to 10 MiB.  Leave protocol overhead while
    # rejecting unexpectedly large requests at the reverse proxy boundary.
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        # Stream uploads to the API instead of buffering candidate documents
        # into the Nginx container's temporary filesystem.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
